<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#667eea"/>
  
  <!-- Open book - left page -->
  <path d="M256 140 L256 380 Q200 360 120 370 L120 150 Q200 140 256 160 Z" 
        fill="#ffffff" opacity="0.95"/>
  
  <!-- Open book - right page -->
  <path d="M256 140 L256 380 Q312 360 392 370 L392 150 Q312 140 256 160 Z" 
        fill="#ffffff" opacity="0.9"/>
  
  <!-- Book spine shadow -->
  <path d="M256 140 L256 380" stroke="#667eea" stroke-width="4" opacity="0.3"/>
  
  <!-- Bookmark ribbon -->
  <path d="M310 120 L310 220 L330 195 L350 220 L350 120 Z" fill="#f59e0b"/>
  
  <!-- Text lines on left page -->
  <line x1="145" y1="190" x2="230" y2="195" stroke="#667eea" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  <line x1="145" y1="220" x2="220" y2="225" stroke="#667eea" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  <line x1="145" y1="250" x2="225" y2="255" stroke="#667eea" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  <line x1="145" y1="280" x2="215" y2="285" stroke="#667eea" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  <line x1="145" y1="310" x2="210" y2="315" stroke="#667eea" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  
  <!-- Text lines on right page -->
  <line x1="282" y1="195" x2="367" y2="190" stroke="#667eea" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  <line x1="282" y1="225" x2="357" y2="220" stroke="#667eea" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  <line x1="282" y1="255" x2="362" y2="250" stroke="#667eea" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  <line x1="282" y1="285" x2="352" y2="280" stroke="#667eea" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  <line x1="282" y1="315" x2="347" y2="310" stroke="#667eea" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
</svg>
