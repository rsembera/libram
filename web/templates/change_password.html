{% extends "base.html" %}

{% block title %}Change Password - Libram{% endblock %}

{% block content %}

<div class="form-card narrow">
    <div class="form-header">
        <h2><i data-lucide="key" class="page-icon"></i>Change Password</h2>
        <a href="{{ url_for('settings.settings_page') }}" class="btn btn-secondary">
            <i data-lucide="arrow-left" class="icon-sm icon-inline"></i> Back
        </a>
    </div>
    
    {% if success %}
    <div class="success-box">
        Password changed successfully!
    </div>
    {% endif %}
    
    {% if error %}
    <div class="error-box">
        {{ error }}
    </div>
    {% endif %}
    
    <form method="post">
        <div class="form-group">
            <label for="current_password">Current Password</label>
            <input type="password" id="current_password" name="current_password" required>
        </div>
        
        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" required>
            <small class="helper-text">At least 6 characters</small>
        </div>
        
        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        
        <div class="form-actions">
            <a href="{{ url_for('settings.settings_page') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Change Password</button>
        </div>
    </form>
</div>

{% endblock %}
