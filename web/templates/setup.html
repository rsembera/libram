<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup - Libram</title>
    
    <!-- Phosphor Icons -->
    <link rel="stylesheet" href="/static/css/phosphor.css">
    
    <style>
        @font-face {
            font-family: 'Lexend';
            src: url('/static/fonts/Lexend-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Lexend';
            src: url('/static/fonts/Lexend-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Libre Baskerville';
            src: url('/static/fonts/LibreBaskerville-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Libre Baskerville';
            src: url('/static/fonts/LibreBaskerville-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Libre Baskerville', Georgia, serif;
            background: #e8e4e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .setup-card {
            background: #f5f3f0;
            border: 1px solid #c8c4c0;
            border-radius: 1rem;
            padding: 3rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            animation: cardFade 0.5s ease-out;
        }
        
        @keyframes cardFade {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo-image {
            width: 90px;
            height: auto;
            margin-bottom: 0.75rem;
        }
        
        .logo-title {
            font-family: 'Lexend', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }
        
        .tagline {
            font-size: 0.875rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #707070;
        }
        
        .welcome-text {
            background: #e8f0e8;
            border: 1px solid #b8d0b8;
            color: #2a4a2a;
            padding: 0.875rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            line-height: 1.6;
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }
        
        .welcome-text i {
            flex-shrink: 0;
            margin-top: 2px;
            color: #4a8a4a;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 400;
            color: #404040;
            font-size: 0.875rem;
        }
        
        .form-group small {
            display: block;
            margin-top: 0.5rem;
            color: #707070;
            font-size: 0.8125rem;
        }
        
        .password-wrapper {
            position: relative;
        }
        
        .password-wrapper input {
            width: 100%;
            padding: 0.875rem 2.75rem 0.875rem 1rem;
            background: #fff;
            border: 1px solid #c8c4c0;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: 'Libre Baskerville', Georgia, serif;
            color: #1a1a1a;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        
        .password-wrapper input::placeholder {
            color: #a0a0a0;
        }
        
        .password-wrapper input:focus {
            outline: none;
            border-color: #404040;
            box-shadow: 0 0 0 3px rgba(64, 64, 64, 0.1);
        }
        
        .toggle-password {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #707070;
            padding: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        
        .toggle-password:hover {
            color: #1a1a1a;
        }
        
        .error-message {
            background: #fde8e8;
            border: 1px solid #e8b8b8;
            color: #802020;
            padding: 0.875rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-setup {
            width: 100%;
            padding: 0.875rem 1rem;
            background: #2a2a2a;
            color: #f5f3f0;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.9375rem;
            font-weight: 700;
            font-family: 'Libre Baskerville', Georgia, serif;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .btn-setup:hover {
            background: #1a1a1a;
        }
        
        .btn-setup:active {
            transform: translateY(1px);
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .setup-card {
                padding: 2rem 1.5rem;
            }
            
            .logo-image {
                width: 70px;
            }
            
            .logo-title {
                font-size: 2rem;
            }
            
            input[type="password"] {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="setup-card">
        <div class="logo">
            <img src="/static/img/login-logo.png" alt="Libram" class="logo-image">
            <h1 class="logo-title">Libram</h1>
            <p class="tagline">Personal Reading Tracker</p>
        </div>
        
        <div class="welcome-text">
            <i class="ph ph-book-open-text" style="width: 20px; height: 20px;"></i>
            <span>Welcome! Choose a password to protect your library.</span>
        </div>
        
        {% if error %}
        <div class="error-message">
            <i class="ph ph-warning-circle" style="width: 16px; height: 16px;"></i>
            {{ error }}
        </div>
        {% endif %}
        
        <form method="post">
            <div class="form-group">
                <label for="password">Create Password</label>
                <div class="password-wrapper">
                    <input type="password" 
                           id="password" 
                           name="password" 
                           placeholder="Choose a password"
                           autofocus
                           required>
                    <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                        <i class="ph ph-eye icon-show"></i>
                        <i class="ph ph-eye-slash icon-hide" style="display: none;"></i>
                    </button>
                </div>
                <small>At least 6 characters</small>
            </div>
            
            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" 
                           id="confirm" 
                           name="confirm" 
                           placeholder="Confirm your password"
                           required>
                    <button type="button" class="toggle-password" onclick="togglePassword('confirm', this)">
                        <i class="ph ph-eye icon-show"></i>
                        <i class="ph ph-eye-slash icon-hide" style="display: none;"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="btn-setup">
                <i class="ph ph-book-bookmark" style="width: 18px; height: 18px;"></i>
                Start Tracking
            </button>
        </form>
    </div>
    
    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const showIcon = btn.querySelector('.icon-show');
            const hideIcon = btn.querySelector('.icon-hide');
            
            if (input.type === 'password') {
                input.type = 'text';
                showIcon.style.display = 'none';
                hideIcon.style.display = 'block';
            } else {
                input.type = 'password';
                showIcon.style.display = 'block';
                hideIcon.style.display = 'none';
            }
        }
    </script>
</body>
</html>
