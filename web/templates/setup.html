<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup - Libram</title>
    
    <!-- Phosphor Icons -->
    <link rel="stylesheet" href="/static/css/phosphor.css">
    
    <style>
        @font-face {
            font-family: 'Libre Baskerville';
            src: url('/static/fonts/LibreBaskerville-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Libre Baskerville';
            src: url('/static/fonts/LibreBaskerville-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Libre Baskerville', Georgia, serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .setup-card {
            background: white;
            border-radius: 1.5rem;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo-icon {
            font-size: 80px !important;
            color: #667eea;
            margin-bottom: 0.5rem;
        }
        
        .logo h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 0.5rem;
        }
        
        .logo p {
            color: #6B7280;
            font-size: 0.9375rem;
        }
        
        .welcome-text {
            background: #F0FDF4;
            border: 1px solid #BBF7D0;
            color: #166534;
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
            font-size: 0.9375rem;
            line-height: 1.6;
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }
        
        .welcome-text i {
            flex-shrink: 0;
            margin-top: 2px;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 700;
            color: #374151;
            font-size: 0.875rem;
        }
        
        .password-wrapper {
            position: relative;
        }
        
        .password-wrapper input {
            width: 100%;
            padding: 0.875rem 3rem 0.875rem 1rem;
            border: 2px solid #E5E7EB;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-family: 'Libre Baskerville', Georgia, serif;
            transition: border-color 0.2s;
        }
        
        .password-wrapper input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .toggle-password {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #9CA3AF;
            padding: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .toggle-password:hover {
            color: #667eea;
        }
        
        .form-group small {
            display: block;
            margin-top: 0.5rem;
            color: #6B7280;
            font-size: 0.8125rem;
        }
        
        .error-message {
            background: #FEE2E2;
            border: 1px solid #FECACA;
            color: #DC2626;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-setup {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Libre Baskerville', Georgia, serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .btn-setup:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .setup-card {
                padding: 2rem 1.5rem;
                border-radius: 1rem;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            input[type="password"] {
                font-size: 16px; /* Prevent iOS zoom */
            }
        }
    </style>
</head>
<body>
    <div class="setup-card">
        <div class="logo">
            <i class="ph ph-book-open logo-icon"></i>
            <h1>Libram</h1>
            <p>Personal Reading Tracker</p>
        </div>
        
        <div class="welcome-text">
            <i class="ph ph-sparkle" style="width: 20px; height: 20px;"></i>
            <span>Welcome! Let's set up your reading tracker. Choose a password to protect your library.</span>
        </div>
        
        {% if error %}
        <div class="error-message">
            <i class="ph ph-warning-circle" style="width: 16px; height: 16px;"></i>
            {{ error }}
        </div>
        {% endif %}
        
        <form method="post">
            <div class="form-group">
                <label for="password">Create Password</label>
                <div class="password-wrapper">
                    <input type="password" 
                           id="password" 
                           name="password" 
                           placeholder="Choose a password"
                           autofocus
                           required>
                    <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                        <i class="ph ph-eye" class="icon-show"></i>
                        <i class="ph ph-eye-slash" class="icon-hide" style="display: none;"></i>
                    </button>
                </div>
                <small>At least 6 characters</small>
            </div>
            
            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" 
                           id="confirm" 
                           name="confirm" 
                           placeholder="Confirm your password"
                           required>
                    <button type="button" class="toggle-password" onclick="togglePassword('confirm', this)">
                        <i class="ph ph-eye" class="icon-show"></i>
                        <i class="ph ph-eye-slash" class="icon-hide" style="display: none;"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="btn-setup">
                <i class="ph ph-rocket" style="width: 20px; height: 20px;"></i>
                Start Tracking
            </button>
        </form>
    </div>
    
    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const showIcon = btn.querySelector('.icon-show');
            const hideIcon = btn.querySelector('.icon-hide');
            
            if (input.type === 'password') {
                input.type = 'text';
                showIcon.style.display = 'none';
                hideIcon.style.display = 'block';
            } else {
                input.type = 'password';
                showIcon.style.display = 'block';
                hideIcon.style.display = 'none';
            }
        }
    </script>
</body>
</html>
