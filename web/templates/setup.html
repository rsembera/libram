<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup - Libram</title>
    
    <!-- Phosphor Icons -->
    <link rel="stylesheet" href="/static/css/phosphor.css">
    
    <style>
        @font-face {
            font-family: 'Libre Baskerville';
            src: url('/static/fonts/LibreBaskerville-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Libre Baskerville';
            src: url('/static/fonts/LibreBaskerville-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Libre Baskerville', Georgia, serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }
        
        /* Ambient background glow */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(88, 28, 135, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(219, 39, 119, 0.08) 0%, transparent 40%);
            animation: ambientShift 20s ease-in-out infinite;
        }
        
        @keyframes ambientShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(2%, -2%) rotate(1deg); }
            66% { transform: translate(-2%, 2%) rotate(-1deg); }
        }
        
        .setup-card {
            background: rgba(15, 15, 25, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.5rem;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.5),
                0 0 100px rgba(139, 92, 246, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1;
            animation: cardFloat 1s ease-out;
        }
        
        @keyframes cardFloat {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo-image {
            width: 100%;
            max-width: 280px;
            height: auto;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.3));
        }
        
        .tagline {
            font-size: 0.875rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            background: linear-gradient(90deg, #06b6d4, #a855f7, #db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .welcome-text {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            color: #6ee7b7;
            padding: 0.875rem 1rem;
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            line-height: 1.6;
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }
        
        .welcome-text i {
            flex-shrink: 0;
            margin-top: 2px;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8125rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        
        .form-group small {
            display: block;
            margin-top: 0.5rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8125rem;
        }
        
        .password-wrapper {
            position: relative;
        }
        
        .password-wrapper input {
            width: 100%;
            padding: 1rem 3rem 1rem 1.25rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            font-size: 1rem;
            font-family: 'Libre Baskerville', Georgia, serif;
            color: #fff;
            transition: all 0.3s ease;
        }
        
        .password-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }
        
        .password-wrapper input:focus {
            outline: none;
            border-color: rgba(168, 85, 247, 0.5);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 
                0 0 0 3px rgba(168, 85, 247, 0.1),
                0 0 20px rgba(168, 85, 247, 0.15);
        }
        
        .toggle-password {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.3);
            padding: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        
        .toggle-password:hover {
            color: rgba(168, 85, 247, 0.8);
        }
        
        .error-message {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(220, 38, 38, 0.3);
            color: #fca5a5;
            padding: 0.875rem 1rem;
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-setup {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 50%, #db2777 100%);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 0.9375rem;
            font-weight: 700;
            font-family: 'Libre Baskerville', Georgia, serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            position: relative;
            overflow: hidden;
        }
        
        .btn-setup::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .btn-setup:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 10px 40px rgba(139, 92, 246, 0.4),
                0 0 60px rgba(219, 39, 119, 0.2);
        }
        
        .btn-setup:hover::before {
            left: 100%;
        }
        
        .btn-setup:active {
            transform: translateY(0);
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .setup-card {
                padding: 2rem 1.5rem;
                border-radius: 1rem;
            }
            
            .logo-image {
                max-width: 240px;
            }
            
            .tagline {
                font-size: 0.9375rem;
            }
            
            input[type="password"] {
                font-size: 16px; /* Prevent iOS zoom */
            }
        }
    </style>
</head>
<body>
    <div class="setup-card">
        <div class="logo">
            <img src="/static/img/login-logo.png" alt="Libram" class="logo-image">
            <p class="tagline">Personal Reading Tracker</p>
        </div>
        
        <div class="welcome-text">
            <i class="ph ph-sparkle" style="width: 20px; height: 20px;"></i>
            <span>Welcome! Choose a password to protect your library.</span>
        </div>
        
        {% if error %}
        <div class="error-message">
            <i class="ph ph-warning-circle" style="width: 16px; height: 16px;"></i>
            {{ error }}
        </div>
        {% endif %}
        
        <form method="post">
            <div class="form-group">
                <label for="password">Create Password</label>
                <div class="password-wrapper">
                    <input type="password" 
                           id="password" 
                           name="password" 
                           placeholder="Choose a password"
                           autofocus
                           required>
                    <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                        <i class="ph ph-eye icon-show"></i>
                        <i class="ph ph-eye-slash icon-hide" style="display: none;"></i>
                    </button>
                </div>
                <small>At least 6 characters</small>
            </div>
            
            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" 
                           id="confirm" 
                           name="confirm" 
                           placeholder="Confirm your password"
                           required>
                    <button type="button" class="toggle-password" onclick="togglePassword('confirm', this)">
                        <i class="ph ph-eye icon-show"></i>
                        <i class="ph ph-eye-slash icon-hide" style="display: none;"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="btn-setup">
                <i class="ph ph-rocket" style="width: 20px; height: 20px;"></i>
                Start Tracking
            </button>
        </form>
    </div>
    
    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const showIcon = btn.querySelector('.icon-show');
            const hideIcon = btn.querySelector('.icon-hide');
            
            if (input.type === 'password') {
                input.type = 'text';
                showIcon.style.display = 'none';
                hideIcon.style.display = 'block';
            } else {
                input.type = 'password';
                showIcon.style.display = 'block';
                hideIcon.style.display = 'none';
            }
        }
    </script>
</body>
</html>
