<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Libram{% endblock %}</title>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Shared CSS (includes local Libre Baskerville font) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared.css') }}">
    
    {% block extra_css %}{% endblock %}
</head>
<body class="{{ card_style or 'tutti-frutti' }} {% if not background_style.startswith('user:') %}bg-{{ background_style or 'suit-grey' }}{% endif %} font-{{ font_style or 'libre-baskerville' }}"{% if background_style.startswith('user:') %} style="background-image: url('/static/user_backgrounds/{{ background_style[5:] }}'); background-size: cover; background-position: center; background-attachment: fixed;"{% endif %}>
    
    {% block content %}{% endblock %}
    
    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
